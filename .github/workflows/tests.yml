# Runs the test suite on a fresh checkout at every push, on Windows (the
# laboratory workstation) and on Linux (the development machine).
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # The tests marked `chromium` print real PDFs; without it they are skipped.
      # Retried: the Linux runner's apt mirrors sometimes fail to resolve.
      - name: Install Chromium
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "Chromium install failed (attempt $attempt), retrying in 30 s..."
            sleep 30
          done
          exit 1

      - name: Model changes without a migration
        run: python app/manage.py makemigrations --check --dry-run

      - name: Tests
        run: python -m pytest -q
